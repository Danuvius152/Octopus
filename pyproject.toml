[project]
name = "octopus"
version = "0.1.0"
description = "Personal agent platform for Claude Code and Codex"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.0",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "anyio>=4.0",
    "cryptography>=46.0",
    "httpx>=0.27",
    "pydantic-core>=2.0",
    "apscheduler>=3.10",
    "mcp>=1.30,<2",
    "PyYAML>=6.0",
    "markdown-it-py>=3.0,<5",
    "jieba>=0.42.1,<0.43",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist==3.8.0",
    "pytest-cov>=7.0",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "packaging>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
octopus = "server.cli:main"

[tool.setuptools.package-data]
"server" = ["app_agent_client.js"]
"server.wiki" = ["prompts/*.md"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
# server/ and tests/ are the hand-written Python; .venv and generated
# artefacts are not ours to lint.
target-version = "py312"
line-length = 88
exclude = [".venv", "web", "docs"]

[tool.ruff.lint]
# Check pyflakes, pycodestyle, isort, pyupgrade and flake8-bugbear rules.
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    # The codebase uses long explanatory comments and prose docstrings that
    # read better unwrapped than hard-folded at 88 columns. Code length is
    # still enforced by the formatter.
    "E501",

    # Exception chaining depends on the boundary: harness domain errors may
    # retain a cause; HTTP response conversion may intentionally suppress it.
    # Review that choice at the affected site.
    "B904",

    # String/Enum members are serialized into API responses and generated
    # web/src/api/contracts.ts.
    # StrEnum differs from (str, Enum) in __str__/__format__ behavior, so
    # this "modernization" can change wire output. Not worth the risk for a
    # cosmetic gain.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Several MCP server modules must set sys.path / env before importing the
# package, so their imports legitimately come after executable statements.
"server/mcp_servers/*.py" = ["E402"]
"server/mcp_servers/connectors/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# `Depends()` in an argument default IS the FastAPI idiom — B008 is a false
# positive on every dependency-injected route and on the shared auth helper.
"server/auth.py" = ["B008"]
"server/routers/*.py" = ["B008"]
"server/app_agent.py" = ["B008"]

[tool.mypy]
# Check annotated service code with the explicit options below; untyped bodies
# and missing third-party stubs are outside this configuration's coverage.
python_version = "3.12"
files = ["server"]
exclude = ["^\\.venv/", "^web/"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
# The two that catch real defects without demanding new annotations:
warn_redundant_casts = true
no_implicit_optional = true

# Error codes are enforced globally. Any unavoidable external boundary
# limitation is documented at the affected line rather than exempting new code.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
# `real` covers provider and supervisor integration. The ordinary full suite
# selects hermetic correctness; --run-real enables the real tier. Optional Wiki
# performance and answer evaluation require their own flags in tests/conftest.py.
# Provider markers say WHICH
# CLI a test needs and how strongly: `*_bin` wants only the binary on
# PATH (a login test must NOT require being logged in), `real_claude` /
# `real_codex` want one that is signed in and actually answers.
#
# These are markers rather than module-level skipif calls so the probe
# happens in pytest_runtest_setup (tests/conftest.py), keeping provider probes
# out of imports and collection-only runs.
markers = [
    "real: real provider or supervisor integration; requires --run-real",
    "supervisor: isolated systemd user-unit checks; no provider CLI or production service mutations",
    "knowledge_eval: optional knowledge-answer and maintenance-intent evaluations; requires --run-knowledge-evals",
    "wiki_perf: optional Wiki scale and performance measurements; requires --run-wiki-perf",
    "real_claude: needs a claude CLI that is installed AND signed in",
    "real_codex: needs a codex CLI that is installed AND signed in",
    "native_codex: real_codex gate uses the configured G0-pinned App Server binary",
    "claude_bin: needs only the claude binary on PATH, not a login",
    "codex_bin: needs only the codex binary on PATH, not a login",
]

[tool.coverage.run]
branch = true
source = ["server"]
relative_files = true
# Coverage is opt-in. Include Python service subprocesses as well as xdist
# workers when a coverage run is explicitly selected.
patch = ["subprocess"]
