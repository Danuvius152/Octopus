# lefthook — pre-commit checks.
#
# Install once:
#   brew install lefthook    # or:  npm install -g lefthook
#   lefthook install
#
# Or run the bundled bootstrap:
#   ./scripts/setup-hooks.sh
#
# What it does, by what you touched:
# - Python in server/ or tests/  → ruff, mypy, and the full hermetic pytest tier
# - frontend code, fixtures/config/lock → eslint, typecheck, and vitest
# - release asset parser or its dependency manifests → frontend checks and pytest
# - server Python, generator inputs, or generated contracts.ts → OpenAPI drift check
# - a plan doc or docs/catalog.md → the generated plans index drift check
# - nothing relevant             → nothing runs
#
# During implementation, run focused checks under AGENTS.md; a Git code commit
# requires full verification. `./scripts/check.sh` runs all integration checks,
# including the full hermetic backend suite; --e2e adds Playwright. Use the
# batch's final validation or this hook as the executor, reusing valid evidence.
#
# `ruff format` is not run by any gate — see the note in scripts/check.sh.

rc: '"$(git rev-parse --show-toplevel)/scripts/toolchain-env.sh"'

pre-commit:
  parallel: true
  commands:
    test-support-imports:
      tags: backend
      glob: &python_inputs
        - &python_direct "{server,tests,scripts}/*.py"
        - &python_nested "{server,tests,scripts}/**/*.py"
        - &python_config "{pyproject.toml,constraints-python.txt,lefthook.yml}"
        - &python_helpers "scripts/{check,toolchain-env,setup-hooks}.sh"
      run: .venv/bin/python scripts/check_test_imports.py
      fail_text: "Move reusable helpers into support modules; do not import new test case modules."

    ruff:
      tags: backend
      glob: *python_inputs
      run: .venv/bin/ruff check .
      fail_text: "Ruff found problems. Run '.venv/bin/ruff check .' (many are auto-fixable with --fix)."

    mypy:
      tags: backend
      glob:
        - "server/*.py"
        - "server/**/*.py"
        - "pyproject.toml"
        - "constraints-python.txt"
      run: .venv/bin/mypy
      fail_text: "mypy found type errors. Run '.venv/bin/mypy' for detail."

    eslint:
      tags: frontend
      # Lefthook's glob requires a slash for **/: list direct children too.
      # These fixtures/scripts are read by frontend tests across directories.
      glob: &frontend_inputs
        - "web/{src,e2e,tests}/*.{ts,tsx,js,jsx,json}"
        - "web/{src,e2e,tests}/**/*.{ts,tsx,js,jsx,json}"
        - "web/*.{ts,js,json}"
        - "web/release-entry-assets.mjs"
        - "web/bun.lock"
        - "tests/fixtures/wiki-command-cases.json"
        - "server/app_agent_client.js"
        - "lefthook.yml"
        - "scripts/toolchain-env.sh"
      run: cd web && bun run lint
      fail_text: "ESLint found problems. Run 'cd web && bun run lint' for detail."

    tsc:
      tags: frontend
      glob: *frontend_inputs
      run: cd web && bun run typecheck
      fail_text: "TypeScript errors. Run 'cd web && bun run typecheck' for detail."

    vitest:
      tags: frontend
      glob: *frontend_inputs
      run: cd web && bun run test
      fail_text: "Frontend tests failed. Run 'cd web && bun run test' for detail."

    pytest:
      tags: backend
      # The hermetic suite also exercises the release parser and its Web dependencies.
      glob:
        - *python_direct
        - *python_nested
        - *python_config
        - *python_helpers
        - "web/{release-entry-assets.mjs,package.json,bun.lock}"
      run: ./scripts/check.sh --gate pytest ${OCTOPUS_PYTEST_OUTPUT:+--output "$OCTOPUS_PYTEST_OUTPUT"}
      fail_text: "Backend test gate failed. See the output above."

    architecture-nag:
      tags: backend
      glob:
        - "server/*.py"
        - "server/**/*.py"
      run: ./scripts/nag-architecture.sh

    docs-index:
      tags: docs
      # Current contracts and unfinished plans each own their index metadata.
      glob:
        - "docs/catalog.md"
        - "docs/{implemented,plans}/*.md"
        - "docs/{implemented,plans}/**/*.md"
        - "scripts/gen-docs-index.py"
      run: .venv/bin/python scripts/gen-docs-index.py --check
      fail_text: "Documentation indexes are stale or invalid. Run '.venv/bin/python scripts/gen-docs-index.py'."

    contracts:
      tags: backend
      # Git includes the source path of staged renames when rename detection is off.
      skip:
        - run: >-
            git diff --cached --quiet --no-renames --
            ':(glob)server/**/*.py' pyproject.toml constraints-python.txt constraints-wiki.txt lefthook.yml
            scripts/check-contracts.sh scripts/dump-openapi.py scripts/generate-contracts.sh
            scripts/snapshot-contract-source.py scripts/toolchain-env.sh
            web/package.json web/bun.lock web/bunfig.toml web/src/api/contracts.ts
      run: ./scripts/check-contracts.sh --staged
      fail_text: "OpenAPI contract check failed. See the output above."
