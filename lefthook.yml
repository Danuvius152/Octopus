# lefthook — pre-commit checks.
#
# Install once:
#   brew install lefthook    # or:  npm install -g lefthook
#   lefthook install
#
# Or run the bundled bootstrap:
#   ./scripts/setup-hooks.sh
#
# What it does, by what you touched:
# - Python in server/ or tests/  → ruff, mypy, and the full hermetic pytest tier
# - TS in web/src/               → eslint, typecheck, and the vitest suite
# - routes or pydantic models    → the generated contracts.ts drift check
# - a plan doc or docs/catalog.md → the generated plans index drift check
# - nothing relevant             → nothing runs
#
# During implementation, run focused checks under AGENTS.md; a Git code commit
# requires full verification. `./scripts/check.sh` runs all integration checks,
# including the full hermetic backend suite; --e2e adds Playwright. Use the
# batch's final validation or this hook as the executor, reusing valid evidence.
#
# `ruff format` is not run by any gate — see the note in scripts/check.sh.

pre-commit:
  parallel: true
  commands:
    ruff:
      tags: backend
      glob: "{server,tests}/**/*.py"
      run: .venv/bin/ruff check .
      fail_text: "Ruff found problems. Run '.venv/bin/ruff check .' (many are auto-fixable with --fix)."

    mypy:
      tags: backend
      glob: "server/**/*.py"
      run: .venv/bin/mypy
      fail_text: "mypy found type errors. Run '.venv/bin/mypy' for detail."

    eslint:
      tags: frontend
      glob: "web/{src,e2e}/**/*.{ts,tsx}"
      run: cd web && bun run lint
      fail_text: "ESLint found problems. Run 'cd web && bun run lint' for detail."

    tsc:
      tags: frontend
      glob: "web/src/**/*.{ts,tsx}"
      run: cd web && bun run typecheck
      fail_text: "TypeScript errors. Run 'cd web && bun run typecheck' for detail."

    vitest:
      tags: frontend
      glob: "web/src/**/*.{ts,tsx}"
      run: cd web && bun run test
      fail_text: "Frontend tests failed. Run 'cd web && bun run test' for detail."

    pytest:
      tags: backend
      # Full hermetic backend verification at a Python code commit. Live model
      # tests, knowledge evaluation and Wiki benchmarks are selected separately.
      glob: "{server,tests}/**/*.py"
      run: .venv/bin/pytest tests/ -m "not real and not knowledge_eval and not wiki_perf" -n 4 --dist=loadfile --max-worker-restart=0 -q --tb=short
      fail_text: "Backend tests failed. Run './scripts/check.sh' or the failed test file for detail."

    architecture-nag:
      tags: backend
      glob: "server/**/*.py"
      run: ./scripts/nag-architecture.sh

    docs-index:
      tags: docs
      # Current contracts and unfinished plans each own their index metadata.
      glob: "{docs/catalog.md,docs/implemented/**/*.md,docs/plans/**/*.md,scripts/gen-docs-index.py}"
      run: .venv/bin/python scripts/gen-docs-index.py --check
      fail_text: "Documentation indexes are stale or invalid. Run '.venv/bin/python scripts/gen-docs-index.py'."

    contracts:
      tags: backend
      # web/src/api/contracts.ts is generated from the OpenAPI schema; these
      # are the files that can invalidate it.
      glob: "server/{models.py,main.py,routers/**/*.py}"
      run: ./scripts/check-contracts.sh
      fail_text: "contracts.ts is stale. Run 'cd web && bun run generate:contracts'."
